name: Build ZFlip Launcher

# Compila SOLO el APK del launcher.
# Funciona de dos formas (la detecta sola):
#  - Si hay ZFlip_Launcher.zip en la raiz del repo, lo descomprime y compila.
#  - Si no, y hay app/ + gradlew en la raiz (codigo suelto), compila eso.

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  apk:
    name: Launcher APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar codigo fuente
        id: src
        run: |
          if [ -f ZFlip_Launcher.zip ]; then
            rm -rf ZFlip_Launcher
            unzip -q -o ZFlip_Launcher.zip
            if [ -f ZFlip_Launcher/gradlew ]; then
              echo "dir=ZFlip_Launcher" >> "$GITHUB_OUTPUT"
            else
              # por si el zip trae otra carpeta raiz
              D=$(dirname "$(find . -maxdepth 3 -name gradlew -not -path './.git/*' | head -1)")
              echo "dir=$D" >> "$GITHUB_OUTPUT"
            fi
          elif [ -f gradlew ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          else
            echo "::error::No encuentro ZFlip_Launcher.zip ni gradlew en la raiz del repo"
            exit 1
          fi

      - name: Verificar archivos clave
        run: |
          D="${{ steps.src.outputs.dir }}"
          echo "Compilando desde: $D"
          F="$D/app/src/main/java/com/zflip/launcher/GeodeManager.kt"
          test -f "$F" || { echo "::error::Falta GeodeManager.kt (zip viejo o incompleto)"; exit 1; }
          grep -q "dumpMaps" "$F" && echo "GeodeManager con diagnostico de maps: OK" || echo "::warning::GeodeManager.kt no tiene el diagnostico dumpMaps"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Aceptar licencias del SDK de Android
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$SDKM" --licenses > /dev/null || true

      - name: Compilar APK
        working-directory: ${{ steps.src.outputs.dir }}
        run: |
          chmod +x ./gradlew
          ./gradlew app:assembleDebug --no-daemon 2>&1 | tee ../gradle-build.log

      - name: Resumen de errores
        if: failure()
        run: |
          {
            echo "### Errores de compilacion"
            echo '```'
            grep -E "^e: |error:|FAILED|What went wrong" -A3 gradle-build.log | head -80
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gradle-build-log
          path: gradle-build.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: ZFlip-Launcher-apk
          path: ${{ steps.src.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
