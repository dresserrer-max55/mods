name: Build Geode (loader + mod) para GD 2.2091

# Recompila DESDE EL CODIGO FUENTE, para Android y GD 2.2091:
#   1) el loader de Geode  -> Geode.android64.so / Geode.android32.so
#   2) un mod de Geode (por defecto Globed) contra ese loader -> <mod>.geode
#
# Por que recompilar: el binario de un mod .geode viejo esta enlazado contra los bindings de la version
# de GD para la que se compilo. Compilarlo otra vez con los bindings de 2.2091 es lo unico estable.
#
# Uso: Actions -> "Build Geode (loader + mod) para GD 2.2091" -> Run workflow.
# Puedes cambiar el repo/rama del mod (cualquier mod de Geode con codigo fuente publico).

on:
  # Se ejecuta (1) a mano desde Actions -> Run workflow y (2) automaticamente al hacer push de ESTE archivo.
  push:
    branches: [ main, master ]
    paths: [ '.github/workflows/build-mods-geode.yml' ]
  workflow_dispatch:
    inputs:
      mod_repo:
        description: 'Repo del mod (owner/repo)'
        default: 'GlobedGD/globed2'
      mod_ref:
        description: 'Rama, tag o commit del mod (vacio = rama por defecto)'
        default: ''
      geode_ref:
        description: 'Rama, tag o commit de geode-sdk/geode (v6 = adaptada a GD 2.2091; main sigue en 2.2081)'
        default: 'v6'
      gd_version:
        description: 'Version de GD objetivo'
        default: '2.2091'
      mod_configure_args:
        description: 'Argumentos extra de CMake para el mod'
        default: '-DGLOBED_RELEASE=ON'

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/cpm-cache
  GD_VERSION: ${{ inputs.gd_version || '2.2091' }}

jobs:
  loader:
    name: Loader Geode (${{ matrix.id }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: android64, abi: arm64-v8a }
          - { id: android32, abi: armeabi-v7a }
    steps:
      - uses: actions/checkout@v4
        with:
          repository: geode-sdk/geode
          ref: ${{ inputs.geode_ref || 'v6' }}
          submodules: recursive

      # El loader de Android solo conoce los codigos de version hasta 41 (2.2081); sin esto devolveria "43"
      # en vez de "2.2091" en las peticiones al servidor de mods. Se anaden 42 y 43.
      - name: Reconocer los codigos de version 42/43 de GD
        shell: bash
        run: |
          f=loader/src/platform/android/LoaderImpl.cpp
          grep -q 'case 41:' "$f" || { echo "No se encontro 'case 41:' en $f"; exit 1; }
          sed -i 's|^\( *\)case 41: m_gdVersion = "2.2081"; break;|&\n\1case 42: m_gdVersion = "2.209"; break;\n\1case 43: m_gdVersion = "2.2091"; break;|' "$f"
          grep -n 'case 4[0-9]' "$f"

      - name: Instalar Ninja
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build

      - uses: geode-sdk/cli/.github/actions/setup@main

      - uses: actions/cache@v4
        with:
          path: cpm-cache
          key: cpm-loader-${{ matrix.id }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}
          restore-keys: cpm-loader-${{ matrix.id }}-

      - name: Configurar loader
        shell: bash
        run: |
          set -euo pipefail
          COMP="${GD_VERSION//./}"
          NDK=/usr/local/lib/android/sdk/ndk/29.0.14206865
          [ -d "$NDK" ] || NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DGEODE_CODEGEN_CMAKE_ARGS="-DCMAKE_C_COMPILER=clang;-DCMAKE_CXX_COMPILER=clang++;-G Ninja" \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DANDROID_PLATFORM=android-23 -DANDROID_STL=c++_shared \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON \
            -DGEODE_GD_VERSION="$GD_VERSION" -DGEODE_COMP_GD_VERSION="$COMP"
          echo "NDK=$NDK" >> "$GITHUB_ENV"

      # El log de GitHub se corta y el error real queda al final. Aqui se guarda todo en build.log,
      # se resumen los errores en el "Summary" de la ejecucion y se sube build.log como artefacto.
      - name: Compilar
        shell: bash
        run: |
          set +e
          cmake --build build --parallel 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            {
              echo "## Error compilando el loader (${{ matrix.id }})"
              echo '```'
              grep -n -B1 -A14 -E 'FAILED:|error:|undefined reference|ld: error|fatal error' build.log | head -150
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
            echo "::error title=Loader ${{ matrix.id }}::fallo la compilacion; mira el Summary o el artefacto build-log-${{ matrix.id }}"
          fi
          exit $code

      - name: Subir build.log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.id }}
          path: build.log
          if-no-files-found: ignore

      - name: Quitar simbolos
        shell: bash
        run: |
          f=./bin/nightly/Geode.${{ matrix.id }}.so
          test -f "$f" || { echo "No se genero $f"; find bin -type f | head; exit 1; }
          "$NDK"/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip "$f"

      - uses: actions/upload-artifact@v4
        with:
          name: geode-loader-${{ matrix.id }}
          path: |
            ./bin/nightly/Geode.${{ matrix.id }}.so
            ./bin/nightly/resources
          if-no-files-found: error

  mod:
    name: Mod (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: loader
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: Android64, id: android64, abi: arm64-v8a }
          - { target: Android32, id: android32, abi: armeabi-v7a }
    steps:
      - name: Checkout del mod
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.mod_repo || 'GlobedGD/globed2' }}
          ref: ${{ inputs.mod_ref || '' }}
          submodules: recursive

      - name: Apuntar mod.json a la version de GD
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re, sys
          v = os.environ["GD_VERSION"]
          done = False
          for name in ("mod.json", "mod.json.template"):
              if not os.path.isfile(name):
                  continue
              s = open(name, encoding="utf-8").read()
              def fix(m):
                  body = m.group(2)
                  if body.lstrip().startswith("{"):
                      body = re.sub(r'("android(?:32|64)?"\s*:\s*)"[^"]*"', r'\1"%s"' % v, body)
                  else:
                      body = '"%s"' % v
                  return m.group(1) + body
              n = re.sub(r'("gd"\s*:\s*)(\{[^}]*\}|"[^"]*")', fix, s, count=1)
              open(name, "w", encoding="utf-8").write(n)
              print(name, "->", re.search(r'"gd"\s*:\s*(\{[^}]*\}|"[^"]*")', n).group(1))
              done = True
          if not done:
              sys.exit("No hay mod.json ni mod.json.template en la raiz del repo del mod")
          PY

      # SDK de Geode: la MISMA rama que el loader (v6). El action oficial build-geode-mod no acepta una rama,
      # por eso el mod se compila a mano con los mismos pasos que hace ese action.
      - name: Checkout del SDK de Geode
        uses: actions/checkout@v4
        with:
          repository: geode-sdk/geode
          ref: ${{ inputs.geode_ref || 'v6' }}
          submodules: recursive
          path: geode-sdk-clone

      - name: Loader compilado (para enlazar el mod)
        uses: actions/download-artifact@v4
        with:
          name: geode-loader-${{ matrix.id }}
          path: geode-sdk-clone/bin/nightly

      - name: Instalar Ninja
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build

      - uses: geode-sdk/cli/.github/actions/setup@main

      - uses: actions/cache@v4
        with:
          path: cpm-cache
          key: cpm-mod-${{ matrix.id }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}
          restore-keys: cpm-mod-${{ matrix.id }}-

      - name: Configurar perfil del CLI
        shell: bash
        run: |
          CLI_PROFILE="$GITHUB_WORKSPACE/cli-profile"
          mkdir -p "$CLI_PROFILE/geode/mods" "$CLI_PROFILE/Contents/geode/mods"
          geode profile add --name GithubActions "$CLI_PROFILE/GeometryDash.exe" win
          echo "GEODE_SDK=$GITHUB_WORKSPACE/geode-sdk-clone" >> "$GITHUB_ENV"
          echo "GD_COMP=${GD_VERSION//./}" >> "$GITHUB_ENV"

      - name: Compilar el mod
        shell: bash
        run: |
          set +e
          NDK=/usr/local/lib/android/sdk/ndk/29.0.14206865
          [ -d "$NDK" ] || NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          {
            cmake -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
              -DGEODE_CODEGEN_CMAKE_ARGS="-DCMAKE_C_COMPILER=clang;-DCMAKE_CXX_COMPILER=clang++;-G Ninja" \
              -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
              -DANDROID_STL=c++_shared -DANDROID_ABI=${{ matrix.abi }} -DANDROID_PLATFORM=android-23 \
              -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON \
              -DGEODE_DONT_INSTALL_MODS=ON -DGEODE_TARGET_PLATFORM=${{ matrix.target }} \
              -DGEODE_GD_VERSION="$GD_VERSION" -DGEODE_COMP_GD_VERSION="$GD_COMP" \
              ${{ inputs.mod_configure_args || '-DGLOBED_RELEASE=ON' }} \
            && cmake --build build --parallel
          } 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            {
              echo "## Error compilando el mod (${{ matrix.target }})"
              echo '```'
              grep -n -B1 -A14 -E 'FAILED:|error:|CMake Error|undefined reference|ld: error|fatal error' build.log | head -150
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
            echo "::error title=Mod ${{ matrix.target }}::fallo la compilacion; mira el Summary o el artefacto build-log-mod-${{ matrix.id }}"
            exit $code
          fi
          mkdir -p output
          find build -name '*.geode' -exec cp {} output/ \;
          ls -la output
          ls output/*.geode >/dev/null 2>&1 || { echo "No se genero ningun .geode"; exit 1; }

      - name: Subir build.log del mod
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-log-mod-${{ matrix.id }}
          path: build.log
          if-no-files-found: ignore

      # nombre que espera el action "combine"
      - uses: actions/upload-artifact@v4
        with:
          name: geode-build-${{ matrix.id }}
          path: output/*.geode
          if-no-files-found: error

  package:
    name: Empaquetar
    runs-on: ubuntu-latest
    needs: [ loader, mod ]
    # Empaqueta aunque falle una de las dos compilaciones (p. ej. 32 bits): asi no pierdes el loader de 64 bits.
    if: ${{ !cancelled() }}
    steps:
      - name: Unir .geode de todas las plataformas
        id: combine
        continue-on-error: true
        uses: geode-sdk/build-geode-mod/combine@main
        with:
          zstd: false

      - uses: actions/download-artifact@v4
        with:
          pattern: geode-loader-*
          path: loader
          merge-multiple: true

      - name: Reunir salida
        shell: bash
        run: |
          shopt -s nullglob
          mkdir -p final
          out="${{ steps.combine.outputs.build-output }}"
          [ -n "$out" ] && cp "$out"/*.geode final/ || echo "::warning::no hay .geode (fallo la compilacion del mod)"
          cp loader/*.so final/ || echo "::warning::no hay Geode.*.so (fallo la compilacion del loader)"
          # recursos del loader (archivos sueltos); el Launcher los instala con "Añadir mod"
          [ -d loader/resources ] && (cd loader/resources && zip -qr ../../final/resources.zip .)
          ls -la final
          # el artefacto debe llevar al menos el loader de 64 bits o el de 32
          ls final/Geode.android64.so final/Geode.android32.so >/dev/null 2>&1 || { echo "Ningun loader compilado"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: geode-2.2091-build
          path: final/*
          if-no-files-found: error
          
